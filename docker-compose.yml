# ─────────────────────────────────────────────────────────────────────────────
# Release Console: build, test and release the organization's Android apps
#
#   web      Next.js UI on ${CONSOLE_PORT:-7080}; proxies /api/* to the api service
#   api      NestJS: sign-in, apps, runs; holds no repository, signing or Play key
#   builder  the vault (SSH keys, upload keystores, Play keys, sealed with VAULT_KEY),
#            git over SSH, and the pipeline (Flutter, Android SDK, Fastlane);
#            reachable only by the api
#
# Apps, runs, logs and AABs live in the `builds` volume; repository mirrors and
# the vault live there too, readable by the builder's root only.
#
#   ./scripts/deploy.sh up        build and start on this machine
#   ./scripts/deploy.sh push      build and push images for a server
#   ./scripts/deploy.sh server    on a server: pull images and restart
# See README.md.
# ─────────────────────────────────────────────────────────────────────────────
name: mobile-ci

services:
  api:
    build:
      context: ./apps/api
    image: ${IMAGE_PREFIX:-rajaguru2004/release-console}-api:${IMAGE_TAG:-latest}
    container_name: mobile_ci_api
    restart: unless-stopped
    environment:
      PORT: "3001"
      CONSOLE_PASSWORD: ${CONSOLE_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      BUILDER_URL: http://builder:4000
      BUILDER_TOKEN: ${BUILDER_TOKEN:?BUILDER_TOKEN must be set in .env}
      BUILDS_DIR: /data
    volumes:
      - builds:/data
    depends_on:
      builder:
        condition: service_healthy
    # Only the web container talks to the API; it is not published on the host.
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks:
      - mobile_ci

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:3001
    image: ${IMAGE_PREFIX:-rajaguru2004/release-console}-web:${IMAGE_TAG:-latest}
    container_name: mobile_ci_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CONSOLE_BIND:-0.0.0.0}:${CONSOLE_PORT:-7080}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks:
      - mobile_ci

  builder:
    build:
      # The repository root: the image bakes in mobile-pipeline/ (Fastlane lanes).
      context: .
      dockerfile: apps/builder/Dockerfile
      target: builder
    image: ${IMAGE_PREFIX:-rajaguru2004/release-console}-builder:${IMAGE_TAG:-latest}
    container_name: mobile_ci_builder
    restart: unless-stopped
    # tini as PID 1: reaps the processes builds leave behind (dart, Gradle, Kotlin).
    init: true
    # Deliberately not the whole .env: the builder gets its token, the vault key and its limits.
    environment:
      BUILDER_TOKEN: ${BUILDER_TOKEN:?BUILDER_TOKEN must be set in .env}
      VAULT_KEY: ${VAULT_KEY:?VAULT_KEY must be set in .env (openssl rand -hex 32); it encrypts the stored keys}
      PLAY_SERVICE_ACCOUNT_FILE: /run/console-secrets/play-service-account.json
      GRADLE_HEAP: ${BUILDER_GRADLE_HEAP:-4g}
      KEEP_RUNS: ${BUILDER_KEEP_RUNS:-30}
      # An app's own GitHub token reaches this (or GitHub Enterprise Server) to plan, start and
      # follow its runs there; the app's secrets (keystore, Play key) are never sent elsewhere.
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
    volumes:
      - builds:/data
      # Optional: the default Google Play key for apps without one of their own.
      - ${SECRETS_DIR:-./secrets}:/run/console-secrets:ro
      # Caches that make the second build minutes faster than the first.
      - pub-cache:/cache/pub
      - gradle-cache:/cache/gradle
      # Starts as the image's SDK; Gradle adds what a project needs (NDK, platforms).
      - android-sdk:/opt/android-sdk
    cpus: ${BUILDER_CPUS:-6}
    mem_limit: ${BUILDER_MEMORY:-8g}
    security_opt:
      - no-new-privileges:true
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks:
      - mobile_ci

volumes:
  builds: {}
  pub-cache: {}
  gradle-cache: {}
  android-sdk: {}

networks:
  mobile_ci: {}
