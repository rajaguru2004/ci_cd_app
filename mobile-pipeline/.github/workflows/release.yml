# FusionHRM Android — release pipeline.
#
#   Plan → Tests (+ optional emulator smoke suite) → Signed AAB → Google Play (Fastlane)
#
# The pipeline console (ci_cd_app) starts, watches and reads this workflow through the GitHub
# API and keeps no build state of its own. Its six stages (checkout, dependencies, tests, AAB,
# Fastlane, Google Play) are mapped from the job and step names below, and it reads the
# artifacts by name — rename one here, rename it in apps/api/src/pipeline/stages.ts too.
#
# Three ways in, one pipeline:
#   - The console: workflow_dispatch with the inputs below.
#   - A commit on main whose first line is `release: <notes>` (track = repository variable
#     PLAY_DEFAULT_TRACK, default internal) or `release(<track>): <notes>`.
#   - A tag vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-<track> on a commit that is on main; notes
#     come from store/play-store/release-notes-<version>.txt, else the annotated tag message.
# Any other push to main leaves a skipped run and uses no runner time.
#
# Secret:    PLAY_SERVICE_ACCOUNT_JSON — Google Play service-account key (release and Play
#            check only). The console's Setup page can store it; it never lives in the repo.
# Signing:   android/key.properties + android/app/upload-keystore.jks, as committed.
# Variables: PLAY_DEFAULT_TRACK (internal), VERSION_CODE_OFFSET (1000), FLUTTER_VERSION
#            (3.47.5, the SDK ci.yml tests with) — all optional.
name: Release pipeline

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && format('{0} · {1}{2}',
  inputs.mode == 'release' && format('{0} to {1}', inputs.rehearsal && 'Rehearse release' || 'Release', inputs.track)
  || (inputs.mode == 'validate' && 'Check Play access' || 'Build and test'),
  github.ref_name,
  inputs.request_id != '' && format(' · {0}', inputs.request_id) || '')
  || (startsWith(github.ref, 'refs/tags/') && format('Release tag {0}', github.ref_name)
  || github.event.head_commit.message) }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build = tests + signed AAB · release = that, then Fastlane to Google Play · validate = check the Play key and read each track's version codes"
        type: choice
        options: [build, release, validate]
        default: build
      track:
        description: Google Play track (release only)
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      release_notes:
        description: Google Play "What's new" text, en-US, at most 500 characters (release only)
        type: string
        default: ""
      release_status:
        description: completed rolls the release out; draft leaves it for review in Play Console
        type: choice
        options: [completed, draft]
        default: completed
      version_name:
        description: Version name override, MAJOR.MINOR.PATCH (blank = pubspec.yaml)
        type: string
        default: ""
      integration_tests:
        description: Also run the emulator smoke suite before building
        type: boolean
        default: false
      rehearsal:
        description: "Release only: Google Play validates the whole upload (key, signature, version code, notes) but nothing is published"
        type: boolean
        default: false
      request_id:
        description: Set by the pipeline console so it can find the run it started
        type: string
        default: ""
  push:
    branches: [main]
    tags: ["v*"]

# Version codes must strictly increase on Google Play, so releases queue behind one another.
# Build-only runs and Play checks each get their own group and never wait.
concurrency:
  group: >-
    ${{ ((github.event_name == 'workflow_dispatch' && inputs.mode == 'release')
    || startsWith(github.ref, 'refs/tags/v')
    || startsWith(github.event.head_commit.message, 'release'))
    && 'google-play-release' || format('run-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: ${{ vars.FLUTTER_VERSION || '3.47.5' }}

jobs:
  plan:
    name: Plan
    # Only release commits and tags reach a runner; every other push to main is skipped here.
    if: >-
      github.event_name != 'push'
      || startsWith(github.ref, 'refs/tags/')
      || startsWith(github.event.head_commit.message, 'release:')
      || startsWith(github.event.head_commit.message, 'release(')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      trigger: ${{ steps.plan.outputs.trigger }}
      track: ${{ steps.plan.outputs.track }}
      release_status: ${{ steps.plan.outputs.release_status }}
      version_name: ${{ steps.plan.outputs.version_name }}
      version_code: ${{ steps.plan.outputs.version_code }}
      integration_tests: ${{ steps.plan.outputs.integration_tests }}
      publish: ${{ steps.plan.outputs.publish }}
      rehearsal: ${{ steps.plan.outputs.rehearsal }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # A tag needs main's history to prove the tagged commit is on main.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && 0 || 1 }}
      - name: Resolve plan
        id: plan
        # Inputs and commit messages reach the script only through env, never inline in the
        # script text, so a crafted message cannot become shell.
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_NUMBER: ${{ github.run_number }}
          IN_MODE: ${{ inputs.mode }}
          IN_TRACK: ${{ inputs.track }}
          IN_NOTES: ${{ inputs.release_notes }}
          IN_STATUS: ${{ inputs.release_status }}
          IN_VERSION: ${{ inputs.version_name }}
          IN_INTEGRATION: ${{ inputs.integration_tests }}
          IN_REHEARSAL: ${{ inputs.rehearsal }}
          REQUEST_ID: ${{ inputs.request_id }}
          DEFAULT_TRACK: ${{ vars.PLAY_DEFAULT_TRACK || 'internal' }}
          CODE_OFFSET: ${{ vars.VERSION_CODE_OFFSET || '1000' }}
        run: bash .github/scripts/release-plan.sh
      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-plan
          path: plan.json
          retention-days: 90

  test:
    name: Tests
    needs: plan
    if: needs.plan.outputs.mode == 'build' || needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # Errors only, as ci.yml and the old Bitrise gate did: the tree still carries
      # pre-existing infos and warnings.
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # `live` tests need a real server and credentials; they are excluded as in ci.yml.
      - name: Unit and widget tests
        run: |
          mkdir -p build/test-results
          flutter test --exclude-tags live --file-reporter json:build/test-results/flutter-test.json
      - name: Translation and widget-key checks
        run: |
          if [ -f tool/check_i18n.dart ]; then dart run tool/check_i18n.dart; fi
          if [ -f tool/check_keys.dart ]; then dart run tool/check_keys.dart; fi
      # Uploaded after a failure too: the failing tests are what the console shows first.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/flutter-test.json
          if-no-files-found: ignore
          retention-days: 30

  integration:
    name: Emulator smoke suite
    needs: plan
    if: >-
      needs.plan.outputs.integration_tests == 'true'
      && (needs.plan.outputs.mode == 'build' || needs.plan.outputs.mode == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # Hardware acceleration for the emulator; without it the boot times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The Tier 0 release blockers on a real Android device, against the fakes in
      # integration_test/fakes, so no server is needed.
      - name: Smoke suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: flutter test integration_test/suites/smoke_suite.dart -d emulator-5554

  build:
    name: Signed AAB
    needs: [plan, test, integration]
    if: >-
      !cancelled()
      && needs.test.result == 'success'
      && (needs.integration.result == 'success' || needs.integration.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build signed AAB
        env:
          VERSION_NAME: ${{ needs.plan.outputs.version_name }}
          VERSION_CODE: ${{ needs.plan.outputs.version_code }}
        run: flutter build appbundle --release --build-name="$VERSION_NAME" --build-number="$VERSION_CODE"
      # build.gradle.kts falls back to the debug key when key.properties is missing; Play
      # refuses a debug-signed bundle, so stop here rather than at the upload.
      - name: Verify signature
        env:
          VERSION_NAME: ${{ needs.plan.outputs.version_name }}
          VERSION_CODE: ${{ needs.plan.outputs.version_code }}
          COMMIT: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          test -f "$aab" || { echo "::error title=AAB::No bundle at $aab"; exit 1; }
          cert="$(keytool -printcert -jarfile "$aab")"
          echo "$cert" | head -n 20
          if grep -q 'CN=Android Debug' <<<"$cert"; then
            echo "::error title=Signing::The bundle is signed with the debug key (android/key.properties or the keystore is missing); Google Play would refuse it."
            exit 1
          fi
          jq -n \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --argjson sizeBytes "$(stat -c %s "$aab")" \
            --arg sha256 "$(sha256sum "$aab" | cut -d' ' -f1)" \
            --arg signer "$(sed -n 's/^Owner: //p' <<<"$cert" | head -n 1)" \
            --arg certSha256 "$(sed -nE 's/^[[:space:]]*SHA256: //p' <<<"$cert" | head -n 1)" \
            --arg commit "$COMMIT" \
            --arg ref "$REF_NAME" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versionName: $versionName, versionCode: $versionCode, sizeBytes: $sizeBytes,
              sha256: $sha256, signer: $signer, certSha256: $certSha256, commit: $commit,
              ref: $ref, builtAt: $builtAt}' > build-info.json
          cat build-info.json
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          # An AAB is already a zip; compressing it again only costs time.
          compression-level: 0
          retention-days: 30
      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.json
          retention-days: 90

  release:
    name: Google Play
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: dist
      - name: Write release notes
        env:
          NOTES: ${{ needs.plan.outputs.notes }}
          VERSION_CODE: ${{ needs.plan.outputs.version_code }}
        run: |
          dir=fastlane/metadata/android/en-US/changelogs
          mkdir -p "$dir"
          printf '%s\n' "$NOTES" > "$dir/$VERSION_CODE.txt"
          cat "$dir/$VERSION_CODE.txt"
      - name: Upload to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ needs.plan.outputs.track }}
          PLAY_RELEASE_STATUS: ${{ needs.plan.outputs.release_status }}
          VERSION_NAME: ${{ needs.plan.outputs.version_name }}
          VERSION_CODE: ${{ needs.plan.outputs.version_code }}
          AAB_PATH: dist/bundle/release/app-release.aab
          MAPPING_PATH: dist/mapping/release/mapping.txt
          # A rehearsal uploads into an edit Google validates but that is never committed.
          PLAY_VALIDATE_ONLY: ${{ needs.plan.outputs.rehearsal }}
        run: bundle exec fastlane android deploy
      - name: Upload release info
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: play-release
          path: fastlane/release-info.json
          if-no-files-found: ignore
          retention-days: 90

  play-check:
    name: Google Play access
    needs: plan
    if: needs.plan.outputs.mode == 'validate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Check Play access
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ needs.plan.outputs.version_code }}
        run: bundle exec fastlane android play_status
      - name: Upload Play status
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: play-status
          path: fastlane/play-status.json
          if-no-files-found: ignore
          retention-days: 90
